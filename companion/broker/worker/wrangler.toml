name = "orion-notion-broker"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Public, non-secret config. After the first deploy, set NOTION_REDIRECT_URI to
# this Worker's own /callback URL (e.g. https://orion-notion-broker.<you>.workers.dev/callback)
# and register that exact URL as the Redirect URI of your Notion integration.
[vars]
NOTION_VERSION = "2022-06-28"
NOTION_CLIENT_ID = "378d872b-594c-815c-b6fa-0037b3208c67"
NOTION_REDIRECT_URI = "https://orion-notion-broker.villanimatteo88.workers.dev/callback"

# Secret — DO NOT put here. Set it out-of-band:
#   wrangler secret put NOTION_CLIENT_SECRET
